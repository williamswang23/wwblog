{{ define "main" }}
<header class="page-hero">
  <div class="shell narrow">
    <p class="eyebrow">Research index</p>
    <h1>{{ .Title }}</h1>
  </div>
</header>
<section class="section-block">
  <div class="shell term-grid">
    {{ range .Data.Terms.Alphabetical }}
    <a href="{{ .Page.RelPermalink }}"><strong>{{ .Page.Title }}</strong><span>{{ .Count }} 篇</span></a>
    {{ end }}
  </div>
</section>
{{ end }}
