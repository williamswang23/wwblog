<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="Williams Wang Research 首页">
      {{/* Frame the existing symbol without the source SVG's transparent padding. */}}
      <svg class="brand-symbol" viewBox="116 116 280 280" width="52" height="52" aria-hidden="true" focusable="false">
        <image href="/images/brand/WWR_logo_symbol_only_transparent.svg" width="512" height="512" />
      </svg>
      <span class="brand-wordmark" aria-hidden="true">
        <span class="brand-name">Williams Wang</span>
        <span class="brand-descriptor">Research</span>
      </span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      <a class="{{ if eq .Section "research" }}is-active{{ end }}" href="/research/">研究</a>
      <a class="{{ if eq .Section "series" }}is-active{{ end }}" href="/series/">定期栏目</a>
      <a class="{{ if eq .Section "areas" }}is-active{{ end }}" href="/areas/">研究领域</a>
      <a class="{{ if eq .RelPermalink "/methods/" }}is-active{{ end }}" href="/methods/">方法</a>
      <a class="{{ if eq .RelPermalink "/about/" }}is-active{{ end }}" href="/about/">关于</a>

  </div>
