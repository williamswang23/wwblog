<footer class="site-footer">
  <div class="shell footer-grid">
    <div>
      <img class="footer-logo" src="/images/brand/WWR_logo_reverse_white_transparent.svg" alt="Williams Wang Research">
      <p>独立市场研究。以证据、条件和可证伪性约束判断。</p>
    </div>
    <div class="footer-links">
      <a href="/research/">研究报告</a>
      <a href="/series/">定期栏目</a>
      <a href="/areas/">研究领域</a>
      <a href="/methods/">研究方法</a>
      <a href="/about/">关于本站</a>
      <a href="/join/">Discord 社群</a>
    </div>
  </div>
  {{ if and .IsHome site.Params.visitorStats.enabled }}
  <div id="visitor-stats" class="shell visitor-stats" hidden aria-live="polite">
    <span id="busuanzi_container_site_pv">累计浏览 <span id="busuanzi_value_site_pv"></span> 次</span>
    <span id="busuanzi_container_site_uv">访客数（估计）<span id="busuanzi_value_site_uv"></span></span>
    <span class="visitor-stats-note">{{ site.Params.visitorStats.since }} 起接入统计 · <a href="https://busuanzi.ibruce.info/" target="_blank" rel="noopener noreferrer">不蒜子</a></span>
  </div>
  {{ end }}
  <div class="shell footer-meta">
    <span>© {{ now.Year }} Williams Wang Research</span>
    <span>内容仅供研究交流，不构成投资建议。</span>
  </div>
</footer>
